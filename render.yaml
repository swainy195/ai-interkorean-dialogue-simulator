services:
  - type: web
    name: ai-interkorean-dialogue-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WEB_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CHAT_MODEL
        sync: false
      - key: OPENROUTER_EMBEDDING_MODEL
        sync: false
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: DATA_GO_KR_API_URL
        sync: false
